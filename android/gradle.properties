# Conteneur 4,1 Go — bornes mémoire (mêmes raisons que le dépôt privé, session 11) :
# daemon JVM borné + Kotlin compilé DANS le daemon (pas de workers supplémentaires)
# + pas de parallélisme : un dépassement = OOM-kill du daemon (build perdu).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
