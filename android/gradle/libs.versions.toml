# Catalogue de versions Nyx — source unique des dépendances.
[versions]
agp = "8.5.2"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
composeBom = "2024.09.03"
activityCompose = "1.9.2"
navigationCompose = "2.8.1"
lifecycleRuntime = "2.8.6"
room = "2.6.1"
sqlcipher = "4.5.4"
androidxSqlite = "2.4.0"
lazysodium = "5.1.0"
jna = "5.13.0"
# Bouncy Castle (bcprov-jdk18on) : SHA-3 (FIPS 202) — MessageDigest("SHA3-256")
# n'est fourni par Conscrypt qu'à partir d'Android 14 ; minSdk 26 → BC obligatoire
# pour les checksums onion v3 (R8 ne retient que les classes référencées).
bouncycastle = "1.78.1"
junit = "4.13.2"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
coroutines = "1.9.0"
securityCrypto = "1.1.0-alpha06"
coreKtx = "1.13.1"
# androidx.biometric 1.1.0 : BiometricPrompt (classe 2/3) + repli code appareil —
# verrou LOCAL opt-in de l'app (ADR-010 §3) ; aucune donnée biométrique n'est lue.
androidxBiometric = "1.1.0"
# fragment-ktx explicite (≥ 1.3.0) : requis par le lint dès que l'activité hérite
# de FragmentActivity (BiometricPrompt + registerForActivityResult — v0.1.2).
androidxFragment = "1.8.5"
# tor-binary (topl, Maven Central) : embarque un exécutable tor 0.4.6.5 par ABI
# sous le nom libTor.so, extrait dans nativeLibraryDir (useLegacyPackaging).
# Choix du 2026-10-12 : maven.guardianproject.net (source de org.torproject.jni:tor-android)
# est injoignable depuis certains environnements réseau/CI ; tor-binary est sur Central.
torBinary = "0.4.6.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlcipher = { group = "net.zetetic", name = "android-database-sqlcipher", version.ref = "sqlcipher" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "androidxSqlite" }
lazysodium-android = { group = "com.goterl", name = "lazysodium-android", version.ref = "lazysodium" }
jna-android = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
tor-binary = { group = "io.matthewnelson.topl-android", name = "tor-binary", version.ref = "torBinary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
